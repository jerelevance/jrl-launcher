<!DOCTYPE html>
<meta charset="utf-8">
<title>JRL wallpaper renderer</title>
<style>
@font-face{font-family:"JRL Archivo";src:url(Archivo.ttf);font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:"JRL Mono";src:url(JetBrainsMono.ttf);font-weight:100 800}
@font-face{font-family:"JRL Doto";src:url(Doto.ttf);font-weight:100 900}
body{margin:0;background:#000}
</style>
<canvas id="c"></canvas>
<script src="palettes.js"></script><!-- palettes.js = the HOMEPAL + THEMES block from ../app/src/main/assets/www/index.html -->
<script>
/* Renders JRL lock-screen loops and stills. Every animated value is a pure function of t in [0,T),
   periodic in T, so frame N wraps cleanly to frame 0. */
const T = 12, FPS = 24, S = 2.75;
const cv = document.getElementById('c'), x = cv.getContext('2d');
let W = 0, H = 0;
function size(w, h) { W = cv.width = w; H = cv.height = h; }
function prng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const P0 = HOMEPAL[0];
const F = {
  home: { bg: 'oklch(.46 .29 266)', ink: 'oklch(.98 0 0)', acc: 'oklch(.88 .26 142)', word: 'Jerelevance', sym: 'culture', lbl: 'home' },
  apps: { bg: 'oklch(.69 .2 45)', ink: 'oklch(.2 .03 165)', acc: 'oklch(.99 0 0)', word: 'Packages', sym: 'apps', lbl: 'apps' },
  sys: { bg: 'oklch(.93 .21 115)', ink: 'oklch(.14 0 0)', acc: 'oklch(.6 .24 28)', word: 'Telemetry', sym: 'sys', lbl: 'sys' },
  babel: { bg: 'oklch(.62 .27 352)', ink: 'oklch(.99 0 0)', acc: 'oklch(.93 .23 125)', word: 'Library', sym: 'babel', lbl: 'babel' },
  color: { bg: 'oklch(.21 .035 165)', ink: 'oklch(.9 .1 170)', acc: 'oklch(.93 .23 125)', word: 'Gradient', sym: 'song', lbl: 'color' },
  culture: { bg: 'oklch(.9 .12 172)', ink: 'oklch(.4 .29 266)', acc: 'oklch(.65 .27 0)', word: 'Organism', sym: 'culture', lbl: 'culture' }
};
const SYM = {
  culture: ['.#.....#.', '###...###', '.#.###.#.', '..#####..', '..##X##..', '..#####..', '.#.###.#.', '###...###', '.#.....#.'],
  apps: ['XX.##.XX', 'XX.##.XX', '........', '##.XX.##', '##.XX.##', '........', 'XX.##.XX', 'XX.##.XX'],
  sys: ['......X..', '..#...X..', '..#.#.X.#', '#.#.#.X.#', '#.#.#.X.#', '#.#.#.X.#', 'XXXXXXXXX'],
  babel: ['...###...', '..#...#..', '.#.X.X.#.', '#.......#', '#.X.X.X.#', '#.......#', '.#.X.X.#.', '..#...#..', '...###...'],
  song: ['..#####..', '.#.....#.', '#..###..#', '#.#...#.#', '#.#.X.#.#', '#.#...#.#', '#..###..#', '.#.....#.', '..#####..']
};
function mix(c, a) { return 'color-mix(in oklch,' + c + ' ' + Math.round(a * 100) + '%,transparent)'; }

/* --- pieces --- */
function grid(ctx, f, a) { const g = 28 * S, r = 1.25 * S; ctx.fillStyle = mix(f.ink, a == null ? .24 : a); ctx.beginPath(); for (let y = g / 2; y < H; y += g) for (let X = g / 2; X < W; X += g) { ctx.moveTo(X + r, y); ctx.arc(X, y, r, 0, 6.2832); } ctx.fill(); }
function sym(ctx, name, cx, cy, cell, col, accCol) {
  const rows = SYM[name], w = rows[0].length * cell, h = rows.length * cell, r = cell * .41;
  rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === '.') return; const X = cx - w / 2 + i * cell + cell / 2, Y = cy - h / 2 + j * cell + cell / 2;
    ctx.fillStyle = ch === 'X' ? (accCol || col) : col; ctx.beginPath(); if (ch === 'X') ctx.rect(X - r, Y - r, r * 2, r * 2); else ctx.arc(X, Y, r, 0, 6.2832); ctx.fill(); }));
}
/* stepped breathing: 5 widths x weights, stepped, ping-pong. k = cycles per loop */
const STR = ['expanded', 'semi-expanded', 'normal', 'semi-condensed', 'condensed'], WGT = [800, 750, 700, 600, 500];
function breathStep(t, k) { const ph = (t / T * k) % 1, tri = ph < .5 ? ph * 2 : 2 - ph * 2; return Math.min(4, Math.floor(tri * 5)); }
/* draws text rotated as vertical-rl, sampled into round dots on a grid */
const off = document.createElement('canvas'), ox = off.getContext('2d', { willReadFrequently: true });
function dottedWord(ctx, word, step, opts) {
  const pitch = opts.pitch, fs = opts.fs;
  off.width = Math.ceil(opts.h / pitch); off.height = Math.ceil(opts.w / pitch);   // rotated frame, at grid resolution
  ox.clearRect(0, 0, off.width, off.height); ox.fillStyle = '#fff';
  ox.font = WGT[step] + ' ' + STR[step] + ' ' + (fs / pitch) + 'px "JRL Archivo"'; try { ox.fontStretch = STR[step]; } catch (e) {}
  if (opts.fit) { ox.font = WGT[0] + ' ' + STR[0] + ' ' + (fs / pitch) + 'px "JRL Archivo"'; try { ox.fontStretch = STR[0]; } catch (e) {}
    const mw = ox.measureText(word.toUpperCase()).width, lim = off.width * .96; const k = mw > lim ? lim / mw : 1;
    ox.font = WGT[step] + ' ' + STR[step] + ' ' + (fs * k / pitch) + 'px "JRL Archivo"'; try { ox.fontStretch = STR[step]; } catch (e) {} }
  ox.textBaseline = 'middle'; ox.textAlign = opts.align || 'center';
  const tx = opts.align === 'left' ? off.width * .02 : off.width / 2;
  ox.fillText(word.toUpperCase(), tx, off.height / 2);
  const d = ox.getImageData(0, 0, off.width, off.height).data;
  // rotate 90deg clockwise: offscreen (u,v) -> screen (x0 + (off.height-1-v)*pitch, y0 + u*pitch)
  const out = [];
  for (let v = 0; v < off.height; v++) for (let u = 0; u < off.width; u++) { const a = d[(v * off.width + u) * 4 + 3] / 255; if (a < .3) continue;
    out.push(opts.x0 + (off.height - 1 - v) * pitch + pitch / 2, opts.y0 + u * pitch + pitch / 2, a); }
  return out;
}
function drawDots(ctx, pts, pitch, col, fn) { for (let i = 0; i < pts.length; i += 3) { const X = pts[i], Y = pts[i + 1], a = pts[i + 2]; ctx.fillStyle = fn ? fn(X, Y, a) : col; ctx.beginPath(); ctx.arc(X, Y, pitch * .46 * (.6 + .4 * a), 0, 6.2832); ctx.fill(); } }
function giant(ctx, f, t, k) {
  const fsz = Math.min(W * .42, 210 * S), pitch = 5 * S, colW = fsz * 1.05;
  const pts = dottedWord(ctx, f.word, breathStep(t, k || 2), { pitch, fs: fsz, w: colW, h: H * 1.1, x0: W - colW + fsz * .06, y0: 34 * S, align: 'left' });
  drawDots(ctx, pts, pitch, mix(f.ink, .2));
}

/* --- the culture field: analytic waves, periodic in T --- */
function waves(seed, n) { const r = prng(seed); return Array.from({ length: n }, (_, i) => ({ t: (i + r() * .6) * T / n, x: .1 + r() * .8, y: .3 + r() * .65, s: .85 + r() * .15 })); }
function field(ctx, f, t, W0, opt) {
  opt = opt || {}; const cs = 16 * S, cols = Math.floor(W / cs), rows = Math.floor(H / cs), offX = (W - cols * cs) / 2, offY = (H - rows * cs) / 2;
  const maxR = Math.hypot(W, H), v = 300 * S, band = cs * 1.6, act = [];
  W0.forEach(w => { for (let k = -2; k <= 0; k++) { const age = t - (w.t + k * T); if (age < 0) continue; const R = age * v; if (R > maxR) continue; act.push({ x: w.x * W, y: w.y * H, r: R, a: w.s * (1 - R / maxR) }); } });
  if (opt.extra) opt.extra.forEach(e => act.push(e));
  const br = .08, ph = t / T * 6.2832 * 8;
  const ir = [], is = [], ar = [], as = [];
  ctx.fillStyle = mix(f.ink, .26); ctx.beginPath();
  for (let j = 0; j < rows; j++) { const cy = offY + j * cs + cs / 2; for (let i = 0; i < cols; i++) { const cx = offX + i * cs + cs / 2;
    let E = 0; for (const w of act) { const d = Math.hypot(cx - w.x, cy - w.y), dd = Math.abs(d - w.r); let e = dd < band ? w.a * (1 - dd / band) : 0;
      if (d < w.r) e = Math.max(e, w.a * .55 * Math.exp(-(w.r - d) / (band * 2.2))); if (e > E) E = e; }
    if (E < .07) { const r0 = cs * .09; ctx.moveTo(cx + r0, cy); ctx.arc(cx, cy, r0, 0, 6.2832); continue; }
    const hot = E > .5, sq = E > .42, r = cs * .46 * (.3 + .7 * Math.min(1, E)) * (1 + br * Math.sin(ph + (i + j) * .33));
    (hot ? (sq ? as : ar) : (sq ? is : ir)).push(cx, cy, r); } }
  ctx.fill();
  const dr = (arr, col, q) => { if (!arr.length) return; ctx.fillStyle = col; ctx.beginPath(); for (let k = 0; k < arr.length; k += 3) { const X = arr[k], Y = arr[k + 1], r = arr[k + 2]; if (q) ctx.rect(X - r, Y - r, r * 2, r * 2); else { ctx.moveTo(X + r, Y); ctx.arc(X, Y, r, 0, 6.2832); } } ctx.fill(); };
  dr(ir, f.ink); dr(is, f.ink, 1); dr(ar, f.acc); dr(as, f.acc, 1);
}

/* --- module scene for the glitch loop --- */
function scene(ctx, f, t) {
  ctx.fillStyle = f.bg; ctx.fillRect(0, 0, W, H); grid(ctx, f); giant(ctx, f, t, 4);
  const cell = 13 * S; sym(ctx, f.sym, W * .3, H * .74, cell, f.ink, f.acc);
  ctx.fillStyle = f.ink; ctx.font = '700 ' + (11 * S) + 'px "JRL Mono"'; ctx.textBaseline = 'alphabetic';
  try { ctx.letterSpacing = (2 * S) + 'px'; } catch (e) {}
  ctx.fillText('JRL//01  ' + f.lbl.toUpperCase(), 22 * S, H - 30 * S);
  ctx.fillStyle = f.acc; ctx.fillRect(22 * S, H - 24 * S, 46 * S, 3 * S);
  try { ctx.letterSpacing = '0px'; } catch (e) {}
}
const bufA = document.createElement('canvas'), bufB = document.createElement('canvas');
const ORDER = ['home', 'apps', 'sys', 'babel', 'color', 'culture'], KINDS = ['glitch', 'bands', 'scatter', 'ripple', 'rain', 'checker'];
function glitchLoop(t) {
  bufA.width = bufB.width = W; bufA.height = bufB.height = H;
  const seg = T / ORDER.length, i = Math.floor(t / seg), lt = t - i * seg, hold = 1.05, dur = seg - hold;
  const cur = F[ORDER[i]], nxt = F[ORDER[(i + 1) % ORDER.length]];
  if (lt < hold) { scene(x, cur, t); return; }
  const p = (lt - hold) / dur, kind = KINDS[i % KINDS.length], r = prng(1000 + i);
  scene(bufA.getContext('2d'), cur, t); scene(bufB.getContext('2d'), nxt, t);
  if (kind === 'glitch') {
    x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
    const K = [[0, 70, [0, .72], 'invert(1)'], [.16, 50, [.38, .22], 'none'], [.32, 24, [0, .4], 'hue-rotate(140deg) saturate(1.6)'], [.5, 40, [.12, 0], 'invert(1)'], [.68, 10, [0, .08], 'none'], [.84, 0, [0, 0], 'contrast(1.6)']];
    let k = 0; for (let q = 0; q < K.length; q++) if (p >= K[q][0]) k = q;
    const [, dx, [ct, cb], flt] = K[k], jx = (r() - .5) * 2 * dx * S;
    x.save(); x.beginPath(); x.rect(0, ct * H, W, H - (ct + cb) * H); x.clip(); x.filter = flt; x.drawImage(bufB, jx, 0); x.restore(); x.filter = 'none';
    return;
  }
  x.drawImage(bufB, 0, 0);
  const g = bufA.getContext('2d'); g.globalCompositeOperation = 'destination-out'; g.beginPath();
  const accPts = [];
  if (kind === 'bands') {
    g.globalCompositeOperation = 'source-over';
    const bh = 16 * S, nb = Math.ceil(H / bh); x.save();
    for (let j = 0; j < nb; j++) { const d = r() * .5, dir = r() < .5 ? -1 : 1, q = Math.max(0, Math.min(1, (p - d) / .45)), qs = Math.floor(q * 6) / 6, offx = qs * W * dir;
      x.drawImage(bufA, 0, j * bh, W, bh + 1, offx, j * bh, W, bh + 1); if (q > 0 && q < 1) { x.fillStyle = nxt.acc; x.fillRect(dir > 0 ? offx - 4 * S : offx + W, j * bh, 4 * S, bh); } }
    x.restore(); return;
  }
  const cs = 18 * S, cols = Math.ceil(W / cs), rows = Math.ceil(H / cs), ox0 = r() * W, oy0 = (.3 + r() * .5) * H, maxD = Math.hypot(W, H);
  const colD = Array.from({ length: cols }, () => r() * .5);
  for (let j = 0; j < rows; j++) for (let i2 = 0; i2 < cols; i2++) {
    const cx = i2 * cs + cs / 2, cy = j * cs + cs / 2;
    const d = kind === 'scatter' ? r() * .7 : kind === 'checker' ? ((i2 + j) & 1) * .4 + (((i2 >> 1) + (j >> 1)) & 1) * .14 + r() * .12 : kind === 'rain' ? colD[i2] + j / rows * .25 : Math.hypot(cx - ox0, cy - oy0) / maxD * .62 + r() * .1;
    const q = (p - d) / .3; if (q <= 0) continue;
    if (kind === 'ripple') { if (q >= 1) g.rect(cx - cs / 2 - 1, cy - cs / 2 - 1, cs + 2, cs + 2); else { const rr = (1 - Math.pow(1 - q, 3)) * cs * .74; g.moveTo(cx + rr, cy); g.arc(cx, cy, rr, 0, 6.2832); } if (q < .5) accPts.push(cx, cy, (1 - q / .5) * cs * .38, 1); continue; }
    const sz = q >= 1 ? cs / 2 + .5 : Math.ceil(q * 4) / 4 * (cs / 2 + .5);
    if (kind === 'rain') g.rect(cx - cs / 2 - .5, cy - cs / 2 - .5, cs + 1, sz * 2 + .5); else g.rect(cx - sz, cy - sz, sz * 2, sz * 2);
    if (q < .4) accPts.push(cx, cy, (1 - q / .4) * cs * .26, kind === 'scatter' ? 0 : 1);
  }
  g.fill(); g.globalCompositeOperation = 'source-over'; x.drawImage(bufA, 0, 0);
  x.fillStyle = nxt.acc; x.beginPath(); for (let k = 0; k < accPts.length; k += 4) { const X = accPts[k], Y = accPts[k + 1], s = accPts[k + 2]; if (accPts[k + 3]) x.rect(X - s, Y - s, s * 2, s * 2); else { x.moveTo(X + s, Y); x.arc(X, Y, s, 0, 6.2832); } } x.fill();
}

/* --- the three loops --- */
const W1 = waves(7, 11);
function fieldLoop(t) { const f = F.home; x.fillStyle = f.bg; x.fillRect(0, 0, W, H); field(x, f, t, W1); }
function breatheLoop(t) {
  const f = F.home; x.fillStyle = f.bg; x.fillRect(0, 0, W, H); grid(x, f, .16);
  const fsz = Math.min(W * .62, H * .118, 360 * S), pitch = 4.6 * S, colW = fsz * 1.1;
  const pts = dottedWord(x, 'Jerelevance', breathStep(t, 4), { pitch, fs: fsz, w: colW, h: H * .98, x0: (W - colW) / 2, y0: H * .01, fit: true });
  const sweep = ((t / T) % 1) * (H + 400 * S) - 200 * S;   // a lime scan band travels down once per loop
  drawDots(x, pts, pitch, f.ink, (X, Y) => Math.abs(Y - sweep) < 60 * S ? f.acc : f.ink);
}
window.R = {
  size, T, FPS,
  frame(kind, t) { if (kind === 'field') fieldLoop(t); else if (kind === 'glitch') glitchLoop(t); else breatheLoop(t); },
  /* stills: theme home palette, frozen field, giant word, small label */
  still(name) {
    if (name === 'boot') return bootStill();
    const P = (THEMES[name] && THEMES[name].home) || P0, f = { bg: 'oklch(' + P.fl + ' ' + P.fc + ' ' + P.fh + ')', ink: P.ink, acc: P.acc, word: 'Jerelevance', sym: 'culture', lbl: name };
    x.fillStyle = f.bg; x.fillRect(0, 0, W, H); grid(x, f, .14); giant(x, f, 0, 2);
    const sq = W / H > .7, R0 = sq ? Math.min(W, H) * .25 : W * .3, cx0 = sq ? W * .34 : W * .4, cy0 = Math.min(sq ? H * .6 : H * .74, H - 92 * S - R0);
    field(x, f, 0, [], { extra: [{ x: cx0, y: cy0, r: R0, a: 1 }, { x: cx0, y: cy0, r: R0 * .3, a: .7 }] });
    x.fillStyle = f.ink; x.font = '700 ' + (11 * S) + 'px "JRL Mono"'; try { x.letterSpacing = (2 * S) + 'px'; } catch (e) {}
    x.fillText('JRL//01  ' + name.toUpperCase(), 22 * S, H - 30 * S); x.fillStyle = f.acc; x.fillRect(22 * S, H - 24 * S, 46 * S, 3 * S); try { x.letterSpacing = '0px'; } catch (e) {}
  }
};
function bootStill() {
  const ink = 'oklch(.98 0 0)', acc = 'oklch(.88 .26 142)', dim = mix(ink, .55); x.fillStyle = 'oklch(.46 .29 266)'; x.fillRect(0, 0, W, H);
  const L = 22 * S; let y = H * .42;
  x.fillStyle = ink; x.textBaseline = 'alphabetic';
  const big = Math.min(72 * S, W * .15); x.font = '700 expanded ' + big + 'px "JRL Archivo"'; try { x.fontStretch = 'semi-expanded'; } catch (e) {}
  x.fillText('JERE', L, y); const w1 = x.measureText('JERE').width; x.fillStyle = acc; x.font = 'italic 700 ' + big + 'px "JRL Archivo"'; x.fillText('//', L + w1, y);
  x.fillStyle = ink; x.font = '700 ' + big + 'px "JRL Archivo"'; y += big * .86; x.fillText('LEVANCE', L, y); y += big * .5;
  const lines = [['sys', 'jrl-kernel 4.11.2-graphic-realism · android 16'], ['hw', 'samsung galaxy z fold7 · 8 cores'], ['cpu', 'oklch pipeline online · drift ±9° · 13 fields'], ['dma', '0x7f3a91c0 → 0x0042be17  ██████████ 100%'],
    ['pm', 'queryIntentActivities(MAIN, LAUNCHER) … ok'], ['hex', '4A 45 52 45 4C 45 56 41 4E 43 45'], ['pwr', 'battery … holding'], ['ntf', 'listener bound'], ['net', 'carrier 1420.405 MHz locked'],
    ['cult', 'spawn field --grid=round,square --breathe'], ['auth', 'visitor@jrl-01 … locked. biometric required'], ['warn', 'unsanctioned operator detected'], ['ready', 'JERE//LEVANCE']];
  const fs = 10.5 * S, lh = fs * 1.75; x.font = '400 ' + fs + 'px "JRL Mono"';
  lines.forEach((l, i) => { const yy = y + i * lh; x.fillStyle = dim; x.fillText(String(i + 1).padStart(2, '0'), L, yy);
    x.fillStyle = l[0] === 'warn' ? 'oklch(.85 .17 0)' : l[0] === 'ready' ? acc : (l[0] === 'hex' || l[0] === 'dma') ? dim : ink;
    if (l[0] === 'ready') x.font = '700 ' + fs + 'px "JRL Mono"'; x.fillText('[' + l[0] + '] ', L + fs * 2.4, yy);
    const tw = x.measureText('[' + l[0] + '] ').width; x.fillStyle = (l[0] === 'hex' || l[0] === 'dma') ? dim : ink; x.fillText(l[1], L + fs * 2.4 + tw, yy); });
  y += lines.length * lh + lh * .6; x.strokeStyle = acc; x.lineWidth = 1.5 * S; x.font = '700 ' + fs + 'px "JRL Mono"';
  const label = '[enter] unlock'; const lw = x.measureText(label).width + 24 * S; x.strokeRect(L + fs * 2.4, y - fs * 1.3, lw, fs * 2.1); x.fillStyle = acc; x.fillText(label, L + fs * 2.4 + 12 * S, y);
  x.fillRect(L + fs * 2.4 + lw + 8 * S, y - fs * .95, fs * .6, fs * 1.1);
  const by = H - 40 * S; x.fillStyle = mix(ink, .75); x.font = '400 ' + (10 * S) + 'px "JRL Mono"'; try { x.letterSpacing = (1.6 * S) + 'px'; } catch (e) {}
  x.fillText('LOADING', L, by - 10 * S); const pct = '100%'; x.fillText(pct, W - L - x.measureText(pct).width, by - 10 * S); try { x.letterSpacing = '0px'; } catch (e) {}
  x.fillStyle = mix(ink, .25); x.fillRect(L, by, W - L * 2, 4 * S); x.fillStyle = acc; x.fillRect(L, by, W - L * 2, 4 * S);
}
</script>
