name: Publish wallpapers

on:
  push:
    branches: [wallpapers]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          zip -qr jrl-wallpapers.zip jere no-jere
          (cd jere && zip -q ../jrl-jere.zip *)
          (cd no-jere && zip -q ../jrl-no-jere.zip *)
      - name: Drop release files that are no longer in the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/releases/tags/wallpapers-v1 --jq .id 2>/dev/null || true)
          [ -z "$id" ] && exit 0
          gh api repos/${{ github.repository }}/releases/$id/assets --paginate --jq '.[] | "\(.id) \(.name)"' | while read aid name; do
            case "$name" in jrl-wallpapers.zip|jrl-jere.zip|jrl-no-jere.zip) continue;; esac
            if [ ! -e "jere/$name" ] && [ ! -e "no-jere/$name" ]; then echo "removing $name"; gh api -X DELETE repos/${{ github.repository }}/releases/assets/$aid; fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: wallpapers-v1
          name: "Wallpapers v1 · Fold7 lock screens"
          make_latest: false
          body: |
            Lock-screen loops and stills for the Galaxy Z Fold7. Files ending in **-cover** fit the outside screen (1080×2520); **-inner** fits the unfolded screen (1968×2184).

            **jere** (`jrl-…`): the full JERE//LEVANCE treatment. Giant word, JRL//01 label, boot screen.
            **no-jere** (`nojere-…`): same designs, no name anywhere. Ripples on their own, FIELD in the glitch loop, the culture glyph breathing.

            **Loops** (12 s, seamless): `field`, `glitch`, `breathe`. **Stills:** one per launcher theme.
            **Folders as zips:** `jrl-jere.zip`, `jrl-no-jere.zip`, or both in `jrl-wallpapers.zip`.

            Set: tap a file › download › Gallery › ⋮ › *Set as wallpaper* › *Lock screen*. Use the cover version folded and the inner version unfolded.
          files: |
            jere/*
            no-jere/*
            jrl-wallpapers.zip
            jrl-jere.zip
            jrl-no-jere.zip
