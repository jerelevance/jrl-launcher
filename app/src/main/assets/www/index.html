<!DOCTYPE html>
<html lang="en" data-field="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>JRL Launcher</title>
<meta name="description" content="JERE//LEVANCE home screen. Marathon graphic realism for Android.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;700&family=Doto:wght@700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Bundled fonts (fetched at build time into assets/www/fonts). If they're missing, the Google Fonts link above takes over when online. */
@font-face{font-family:"JRL Archivo";src:url(fonts/Archivo.ttf) format("truetype");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
@font-face{font-family:"JRL Mono";src:url(fonts/JetBrainsMono.ttf) format("truetype");font-weight:100 800;font-display:swap}
@font-face{font-family:"JRL Doto";src:url(fonts/Doto.ttf) format("truetype");font-weight:100 900;font-display:swap}
@property --drift{syntax:'<number>';inherits:true;initial-value:0}

/* ===== palettes: each module is a full-bleed field with its own ink, accent and complementary highlight ===== */
:root{
  --display:"JRL Archivo","Archivo","Arial Black",Helvetica,sans-serif;
  --mono:"JRL Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --dot:"JRL Doto","Doto","JRL Mono","JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.9,.1,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --fl:.46;--fc:.29;--fh:266;--ink:oklch(.98 0 0);--acc:oklch(.88 .26 142);--warn:oklch(.68 .27 0);--onwarn:#111;--hl:oklch(.86 .17 85);--onhl:oklch(.15 0 0);
  color-scheme:dark}
:root,.mpanel{
  --fsel:oklch(var(--fl) var(--fc) var(--fh));--fg:var(--ink);--sig:var(--acc);
  --dim:color-mix(in oklch,var(--ink) 80%,transparent);--rule:color-mix(in oklch,var(--ink) 48%,transparent);
  --panel:color-mix(in oklch,var(--ink) 9%,transparent);--row:color-mix(in oklch,var(--ink) 17%,transparent)}
:root[data-field="apps"],.mpanel[data-panel="apps"]{--fl:.69;--fc:.2;--fh:45;--ink:oklch(.2 .03 165);--acc:oklch(.99 0 0);--warn:oklch(.42 .29 266);--onwarn:#fff;--hl:oklch(.45 .29 266);--onhl:#fff}
:root[data-field="sys"],.mpanel[data-panel="sys"]{--fl:.93;--fc:.21;--fh:115;--ink:oklch(.14 0 0);--acc:oklch(.6 .24 28);--warn:oklch(.6 .24 28);--onwarn:#fff;--hl:oklch(.52 .26 295);--onhl:#fff}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#000;color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.5;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{-webkit-user-select:text;user-select:text}
p{margin:0}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.slash{color:var(--acc);font-style:italic}
.tag{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:2px 7px;background:var(--acc);color:var(--fsel);font-weight:700;white-space:nowrap}

@keyframes flash{0%{clip-path:inset(0 100% 0 0)}45%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
.fl{position:absolute;inset:0;background:var(--hl);pointer-events:none;animation:flash .6s var(--ease) forwards;z-index:2}
@keyframes unfold{0%{clip-path:inset(0 49.5% 0 49.5%)}35%{clip-path:inset(0 49.5% 0 49.5%)}100%{clip-path:inset(0 0 0 0)}}
@keyframes rowin{0%{clip-path:inset(0 100% 0 0);background:var(--warn);color:transparent}60%{clip-path:inset(0 0 0 0);background:var(--warn);color:transparent}100%{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@keyframes breathe2{from{font-stretch:125%}to{font-stretch:92%}}
@keyframes breathe3{from{font-stretch:125%;font-weight:900}to{font-stretch:72%;font-weight:700}}
@keyframes breatheG{from{font-stretch:125%;font-weight:900}to{font-stretch:80%;font-weight:400}}
@keyframes dotw{0%,100%{opacity:1}50%{opacity:.22}}
@keyframes drift{from{--drift:-7}to{--drift:9}}

/* the phone: full screen on a device, a framed column on a desktop preview */
#phone{position:fixed;inset:0;overflow:hidden}
@media (min-width:700px) and (hover:hover){
  body{background:oklch(.16 0 0);background-image:radial-gradient(circle,oklch(.3 0 0) 1px,transparent 1.7px);background-size:22px 22px}
  #phone{inset:auto;left:50%;top:50%;width:400px;height:min(860px,calc(100vh - 40px));transform:translate(-50%,-50%);outline:1.5px solid oklch(.4 0 0);outline-offset:6px}
}

/* ===== stage: the colour field ===== */
.stage{position:absolute;inset:0;overflow:hidden;color:var(--ink);touch-action:pan-y;
  --fbg:oklch(var(--fl) var(--fc) calc(var(--fh) + var(--drift)));
  background-color:var(--fbg);background-image:radial-gradient(circle,color-mix(in oklch,var(--ink) 24%,transparent) 1px,transparent 1.7px);background-size:28px 28px;
  animation:drift 12s steps(24,end) infinite alternate}
:root[data-field="home"] .stage{background-image:none;touch-action:none}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:none}
:root[data-field="home"] #field{display:block}
.giant-wrap{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.giant{position:absolute;right:-.06em;top:calc(var(--sat) + 34px);writing-mode:vertical-rl;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:min(29vw,150px);line-height:.8;letter-spacing:-.02em;text-transform:uppercase;
  color:color-mix(in oklch,var(--ink) 20%,transparent);white-space:nowrap;animation:breatheG 7s steps(7,jump-none) infinite alternate;
  -webkit-mask:radial-gradient(circle,#000 1.6px,transparent 2.1px) 0 0/5px 5px;mask:radial-gradient(circle,#000 1.6px,transparent 2.1px) 0 0/5px 5px}

/* chrome */
.top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-width:0;
  padding:calc(var(--sat) + 8px) calc(var(--sar) + 16px) 8px calc(var(--sal) + 16px)}
.brand{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:14px;letter-spacing:-.01em;white-space:nowrap;animation:breathe2 5s steps(5,jump-none) infinite alternate}
#mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat{display:flex;gap:12px;align-items:center;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stat b{font-family:var(--dot);font-weight:900;font-size:14px;letter-spacing:.04em;color:var(--ink);margin-left:4px}
#s-ntf::before{content:"";display:inline-block;width:6px;height:6px;background:var(--warn);margin-right:5px;vertical-align:1px;animation:blink 1.1s steps(2) infinite}
#s-ntf.off::before{background:transparent;box-sizing:border-box;border:1px solid var(--ink);animation:none}

.floor{position:absolute;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:8px calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px)}
#prompt{display:flex;align-items:center;gap:8px;min-width:0;height:42px;padding:0 12px;border:1.5px solid var(--ink);transition:background .12s,color .12s,border-color .12s}
#prompt .u{color:var(--acc);font-weight:700;white-space:nowrap}
#prompt .cur{width:8px;height:15px;background:var(--acc);flex:none;animation:blink .9s steps(2) infinite}
#prompt .hint{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#prompt:active{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
#prompt:active .u,#prompt:active .hint{color:var(--onhl)}#prompt:active .cur{background:var(--onhl)}
.pager{display:flex;gap:4px}
.pager button{width:36px;height:42px;display:grid;place-items:center;color:var(--dim);border:1.5px solid transparent;transition:background .12s,color .12s}
.pager button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.pager button[aria-selected="true"] .w{animation:dotw 1.3s steps(2,jump-none) infinite}
.pager button:active{background:var(--hl);color:var(--onhl);border-color:var(--hl)}

/* ===== modules ===== */
.mpanel{position:absolute;z-index:2;left:calc(var(--sal) + 16px);right:calc(var(--sar) + 16px);top:calc(var(--sat) + 42px);bottom:calc(var(--sab) + 70px);
  display:flex;flex-direction:column;min-height:0;visibility:hidden;pointer-events:none;color:var(--ink)}
.mpanel.on{visibility:visible;pointer-events:auto;animation:unfold .38s steps(5,end) both}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.mhead .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.mhead h2{margin:0;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(40px,13vw,64px);line-height:.86;letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;animation:breathe2 6s steps(5,jump-none) infinite alternate}
.mhead.r,.mhead.r .ttl{flex-direction:row-reverse}
.mhead.r .lbl{text-align:left}
.mhead.c{flex-direction:column;align-items:center;text-align:center;gap:6px}

.pn{border:1px solid var(--rule);background:var(--panel);position:relative;min-width:0}
.pn::before,.pn::after{content:"";position:absolute;width:8px;height:8px;border:0 solid var(--sig);z-index:1;pointer-events:none}
.pn::before{left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
.pn::after{right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 9px;border-bottom:1px solid var(--rule);font-size:9px;letter-spacing:.18em;text-transform:uppercase;min-height:31px}
.ph>span:last-child,.ph>b{color:var(--dim);font-weight:500}
.pb{padding:10px}
.pn.shut .pb{display:none}.pn.shut .ph{border-bottom:0}
.pn.shut .ph>b{transform:rotate(-90deg)}
.ph>b{transition:transform .2s steps(2,end)}
.nosig{padding:22px 10px;text-align:center;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);background:repeating-linear-gradient(-45deg,var(--row) 0 5px,transparent 5px 10px)}
.nosig b{display:block;font-family:var(--dot);font-weight:900;font-size:22px;letter-spacing:.04em;color:var(--fg);margin-bottom:4px}
.chip{border:1.5px solid var(--ink);padding:5px 10px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;position:relative;overflow:hidden;transition:background .12s,color .12s}
.chip:active{background:var(--hl);color:var(--onhl);border-color:var(--hl)}

/* home: clock strip, agenda, now playing, then the app grid sitting low where the thumb is */
.home{gap:10px}
.h-clock{display:flex;align-items:flex-end;gap:14px;min-width:0}
#clock{font-family:var(--dot);font-weight:900;font-size:min(21vw,96px);line-height:.8;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:-.04em}
#clock .col{animation:blink 2s steps(2,jump-none) infinite}
.h-side{display:grid;gap:5px;min-width:0;padding-bottom:2px;overflow:hidden}
#c-date{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:17px;line-height:1;text-transform:uppercase;white-space:nowrap}
.h-side .lbl{white-space:nowrap;font-variant-numeric:tabular-nums}
#c-s{color:var(--acc)}
.hours{display:flex;gap:2px;margin-top:2px}
.hours{flex-wrap:wrap;max-width:118px}
.hours i{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:.22}
.home .pn{background:var(--fsel)}
.agenda .ph{width:100%;text-align:left}
.agenda .ph:active{background:var(--hl);color:var(--onhl)}
.ag-list{display:grid;gap:2px;padding:6px}
.ev{display:grid;grid-template-columns:48px 44px minmax(0,1fr);gap:8px;align-items:baseline;padding:7px 8px;background:var(--row);text-align:left;transition:background .12s,color .12s;position:relative;overflow:hidden}
.ev .d{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.ev .t{font-family:var(--dot);font-weight:900;font-size:13px;letter-spacing:.02em}
.ev b{font-weight:500;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.now{background:var(--acc);color:var(--fsel)}.ev.now .d{color:var(--fsel)}
.ev:active{background:var(--hl);color:var(--onhl)}
.ag-empty{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.np{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 6px 6px 10px}
.np-eq{display:flex;gap:2px;align-items:flex-end;height:22px}
.np-eq i{width:4px;height:4px;border-radius:50%;background:var(--acc);box-shadow:0 -6px 0 var(--acc),0 -12px 0 var(--acc);opacity:.35}
.np.on .np-eq i{opacity:1;animation:npq .9s steps(3,end) infinite alternate}
.np.on .np-eq i:nth-child(2n){animation-duration:.7s}.np.on .np-eq i:nth-child(3n){animation-duration:1.1s}
@keyframes npq{0%{box-shadow:0 -6px 0 transparent,0 -12px 0 transparent}50%{box-shadow:0 -6px 0 var(--acc),0 -12px 0 transparent}100%{box-shadow:0 -6px 0 var(--acc),0 -12px 0 var(--acc)}}
.np-t{display:grid;min-width:0;text-align:left;line-height:1.25}
.np-t b{font-weight:700;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-t span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-c{display:flex;gap:4px}
.np-c button{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1.5px solid var(--rule);font-size:11px;line-height:1;letter-spacing:0;text-align:center;transition:background .12s,color .12s}
.np-c button svg{display:block}
.np-c button:active{background:var(--hl);color:var(--onhl);border-color:var(--hl)}
.hgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-content:end;container-type:inline-size;touch-action:none}
.hgrid::-webkit-scrollbar{display:none}
.hgrid .tile{height:calc((100cqw - 18px) / 4)}
.home-empty{grid-column:1/-1;border:1.5px dashed var(--rule);padding:18px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:center}
.hours i.on{opacity:1}
.hours i.now{border-radius:0;background:var(--acc);opacity:1;animation:dotw 1.6s steps(2,jump-none) infinite}
.h-tel{align-self:flex-end;width:min(200px,58%)}
.tel{display:grid;gap:7px}
.tel .r{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tel .r b{justify-self:end;font-family:var(--dot);font-weight:900;font-size:16px;color:var(--ink);letter-spacing:.04em}
.batpx{grid-column:1/-1;display:flex;gap:2px}
.batpx i{flex:1;height:7px;background:var(--ink);opacity:.2}
.batpx i.on{opacity:1}.batpx.low i.on{background:var(--warn)}
.dockwrap{align-self:center;width:100%;display:grid;gap:6px;justify-items:center}
.dockwrap .lbl{display:flex;gap:16px}
.dock{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,64px));gap:6px;justify-content:center;width:100%}
.dock-empty{grid-column:1/-1;border:1.5px dashed var(--rule);padding:16px 18px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:center}

/* app cards: square, dot-matrix icon, label */
.card{position:relative;aspect-ratio:1;min-width:0;background:var(--row);color:var(--fg);display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  padding:8px 8px 7px;overflow:hidden;transition:background .12s,color .12s;touch-action:pan-y}
.card .ico{grid-column:1;grid-row:1;width:40px;height:40px;display:grid;place-items:center}
.card .no{grid-column:2;grid-row:1;justify-self:end;font-family:var(--dot);font-weight:900;font-size:12px;letter-spacing:.04em;color:var(--dim);line-height:1}
.card .nm{grid-column:1/-1;grid-row:3;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:11px;line-height:1.04;text-transform:uppercase;letter-spacing:-.005em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .nd{position:absolute;right:8px;bottom:8px;width:7px;height:7px;background:var(--warn);display:none;animation:blink 1.1s steps(2) infinite}
.card.ntf .nd{display:block}
.card:active,.card.hold{background:var(--hl);color:var(--onhl)}
.card:active .no,.card.hold .no{color:var(--onhl)}
.dock .card{touch-action:none}
.card.mini{padding:6px 5px 5px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;justify-items:center}
.card.mini .ico{grid-row:1;width:30px;height:30px;align-self:center}
.card.mini .nm{grid-row:2;font-family:var(--mono);font-weight:500;font-stretch:100%;font-size:8px;letter-spacing:.1em;-webkit-line-clamp:1;text-align:center;max-width:100%}
.card.mini .nd{right:5px;top:5px;bottom:auto}
/* tiles: icon first, small label. used on home, in folders and in the drawer */
.card.tile{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;justify-items:center;padding:6px 4px 5px;gap:3px;touch-action:pan-y}
.hgrid .card.tile{touch-action:none}
.card.tile .ico{grid-column:1;grid-row:1;width:min(46px,62%);height:auto;aspect-ratio:1;align-self:center}
.card.tile .nm{grid-column:1;grid-row:2;font-family:var(--mono);font-weight:500;font-stretch:100%;font-size:8.5px;letter-spacing:.06em;line-height:1.15;-webkit-line-clamp:1;text-align:center;max-width:100%;text-transform:uppercase}
.card.tile .nd{right:5px;top:5px;bottom:auto}
.card.fold .fico{grid-row:1;width:min(48px,66%);aspect-ratio:1;align-self:center;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border:1.5px solid var(--ink)}
.card.fold .fico .ico{width:100%;height:100%}
.card.hide-x{display:none}
.ico img{width:100%;height:100%;display:block;object-fit:contain}
.ico.real img,.ico.mos img{border-radius:22%}
.ico.mos img{image-rendering:pixelated}
.ico.px{background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.ico.real img{width:100%;height:100%;display:block;object-fit:contain}
.ico .sym{width:100%;height:100%}

/* apps module */
.findbar{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 10px;border:1.5px solid var(--ink);margin-bottom:8px;cursor:text}
.findbar .u{font-weight:700;color:var(--ink)}
#find{flex:1;min-width:0;background:transparent;border:0;outline:0;font:inherit;font-size:13px;color:var(--ink);caret-color:var(--ink)}
#find::placeholder{color:var(--dim);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
#find-x{width:32px;height:32px;font-size:18px}
.findbar:focus-within{background:var(--row)}
.gridwrap{position:relative;flex:1;min-height:0;container-type:inline-size}
.grid{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;align-content:start;padding:0 28px 22px 0}
.grid .card{aspect-ratio:auto;height:calc((100cqw - 43px) / 4)}
.lh{height:calc((100cqw - 43px) / 4);font-family:var(--dot);font-weight:900;font-size:clamp(30px,10cqw,46px);line-height:1;display:grid;place-items:center;border:1.5px dashed var(--rule);color:var(--dim)}
.grid.finding .lh{display:none}
.grid::-webkit-scrollbar{display:none}
.az{position:absolute;right:0;top:0;bottom:22px;width:22px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;touch-action:none;
  font-family:var(--dot);font-weight:900;font-size:11px;line-height:1;color:var(--dim);padding:2px 0}
.az span{padding:0 4px}.az span.on{color:var(--fsel);background:var(--ink)}
#azbig{position:absolute;z-index:20;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--dot);font-weight:900;font-size:150px;line-height:1;color:var(--ink);pointer-events:none;
  min-width:1.1em;text-align:center;background:var(--fsel);border:1.5px solid var(--ink);padding:10px 18px 2px}

/* sys module */
.sysgrid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start;padding-bottom:16px;touch-action:pan-y}
.sysgrid::-webkit-scrollbar{display:none}
.sysgrid .wide{grid-column:1/-1}
.load{display:grid;gap:8px}
.load .r{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.load .r b{font-weight:500;font-variant-numeric:tabular-nums}
.load .t{grid-column:1/-1;height:6px;background:var(--row)}
.load .t i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 6px);transition:width .5s steps(4,end)}
.load .t i.hi{background:repeating-linear-gradient(90deg,var(--warn) 0 4px,transparent 4px 6px)}
.eq{display:block;width:100%;height:96px}
.big{display:block;font-family:var(--dot);font-weight:900;font-size:44px;line-height:1;letter-spacing:.02em;margin-bottom:8px}
.rec{display:grid;gap:3px;padding:8px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:baseline;gap:10px;padding:8px 8px;background:var(--row);font-size:11px;position:relative;overflow:hidden;transition:background .12s,color .12s;animation:rowin .34s steps(4,end) both}
.lrow em{font-style:normal;font-family:var(--dot);font-weight:900;font-size:13px;color:var(--dim)}
.lrow b{font-weight:500;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow span{font-size:9px;color:var(--dim);letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.lrow:active{background:var(--hl);color:var(--onhl)}.lrow:active em,.lrow:active span{color:var(--onhl)}
#feed{display:grid;gap:3px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);max-height:150px;overflow:hidden}
#feed div{animation:rowin .34s steps(4,end) both;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#feed div:first-child{color:var(--ink)}#feed .st{color:var(--warn)!important}
.deco{display:grid;gap:8px;align-content:start}
.haz{height:10px;background:repeating-linear-gradient(-45deg,var(--ink) 0 8px,transparent 8px 16px)}
.picto{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.picto>div{aspect-ratio:1;background:var(--ink);display:grid;place-items:center}
.picto>div:nth-child(3n){background:var(--acc)}
.glyph{display:grid;grid-template-columns:repeat(5,3px);grid-auto-rows:3px;gap:1px}
.glyph b{display:block}.glyph b.on{background:var(--fsel)}
.bc{display:flex;height:34px}.bc span{background:var(--ink);display:block}

/* ===== transitions ===== */
.ghost{position:fixed;z-index:30;pointer-events:none}
.sym{display:block;flex:none;overflow:visible}
.sym .w{animation:dotw 2.6s ease-in-out infinite}
.proxy{position:fixed;left:0;top:0;z-index:31;pointer-events:none;border:1.5px solid currentColor;overflow:hidden;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.proxy::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,currentColor 0 1px,transparent 1px 4px);opacity:.28}
.proxy::after{content:"";position:absolute;left:0;right:0;top:30%;height:12%;background:currentColor;mix-blend-mode:difference;animation:pjit .32s steps(1,end) infinite}
@keyframes pjit{0%{top:8%;height:6%;left:0;right:30%}25%{top:52%;height:14%;left:20%;right:0}50%{top:31%;height:3%;left:0;right:0}75%{top:74%;height:9%;left:40%;right:10%}}
.proxy b{position:absolute;left:5px;top:4px;font-weight:700;padding:1px 5px;white-space:nowrap}
.proxy i{position:absolute;right:5px;bottom:4px;font-style:normal;white-space:nowrap}

/* ===== long-press sheet ===== */
#sheet{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .back{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 2px,rgba(0,0,0,.18) 2px 4px)}
.sh{position:relative;margin:0 calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);background:var(--fsel);color:var(--ink);border:1.5px solid var(--ink);animation:unfold .26s steps(4,end) both}
.sh::before,.sh::after{content:"";position:absolute;width:10px;height:10px;border:0 solid var(--acc);pointer-events:none}
.sh::before{left:-2px;top:-2px;border-left-width:3px;border-top-width:3px}.sh::after{right:-2px;bottom:-2px;border-right-width:3px;border-bottom-width:3px}
.sh-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px;border-bottom:1px solid var(--rule)}
#sh-ico{grid-row:1/3;width:52px;height:52px}
#sh-t{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:22px;line-height:.92;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sh-p{grid-column:2;font-size:9px;letter-spacing:.1em;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sh-n{grid-column:3;grid-row:1;font-family:var(--dot);font-weight:900;font-size:16px;color:var(--dim)}
#sh-ntf{grid-column:3;grid-row:2;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:var(--warn);color:var(--onwarn);padding:1px 6px}
.sh-acts button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 14px;border-bottom:1px solid var(--rule);font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:background .12s,color .12s}
.sh-acts button:last-child{border-bottom:0;color:var(--dim)}
.sh-acts button:active{background:var(--hl);color:var(--onhl)}
.sh-acts button i{font-style:normal;font-family:var(--dot);font-weight:900;font-size:13px;color:var(--dim)}
.sh-acts button:active i{color:var(--onhl)}

.sh-acts .alt{color:var(--warn)}
.sh-acts .newf{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.sh-acts .newf input{flex:1;min-width:0;background:transparent;border:1.5px solid var(--ink);padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);outline:0}
.sh-acts .newf button{width:auto;padding:0 14px;border:1.5px solid var(--ink);border-bottom-width:1.5px}

/* folder */
#folder{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:center}
#folder .back{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 2px,rgba(0,0,0,.18) 2px 4px)}
.sh.fo{margin:0 calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px)}
.fo-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule)}
#fo-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px dashed var(--rule);outline:0;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:24px;line-height:1.1;text-transform:uppercase;color:var(--ink);padding:2px 0}
#fo-name:focus{border-bottom-color:var(--acc)}
.fo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:10px;container-type:inline-size;max-height:56vh;overflow-y:auto}
.fo-grid .tile{height:calc((100cqw - 15px) / 4)}
.fo-f{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.fo-f button{padding:14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:background .12s,color .12s}
.fo-f button+button{border-left:1px solid var(--rule)}
.fo-f button:active{background:var(--hl);color:var(--onhl)}

/* ===== boot ===== */
#boot{position:absolute;inset:0;z-index:60;--ink:oklch(.98 0 0);--acc:oklch(.88 .26 142);background:oklch(.46 .29 266);color:var(--ink);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;
  padding:calc(var(--sat) + 18px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);overflow:hidden;transition:clip-path .55s steps(7,end)}
#boot.gone{clip-path:inset(0 0 100% 0)}
#boot .lbl{color:color-mix(in oklch,var(--ink) 75%,transparent)}
#boot .btop{display:flex;justify-content:space-between;gap:12px}
#boot .left{align-self:center;min-width:0}
#boot .bt{margin:0 0 20px;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:min(15vw,72px);line-height:.86;letter-spacing:-.02em;animation:breathe2 4s steps(5,jump-none) infinite alternate}
#bootlog{font-size:10.5px;line-height:1.75;min-height:12em;max-height:52vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#bootlog>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bootlog .h{color:color-mix(in oklch,var(--ink) 55%,transparent)}
#bootlog .n{color:color-mix(in oklch,var(--ink) 55%,transparent);margin-right:8px}
#bootlog .w{color:oklch(.85 .17 0)}
#bootlog .g{color:var(--acc);font-weight:700}
#bootlog .cur{display:inline-block;width:.6em;height:1.05em;background:var(--acc);vertical-align:-3px;margin-left:4px;animation:blink .9s steps(2) infinite}
#bootlog .typed{color:#fff;font-weight:700}#bootlog .typed.bad{color:oklch(.85 .17 0);text-decoration:line-through}
#bootlog .bprompt{display:flex;align-items:center;gap:6px;overflow:visible;padding:4px 0}
#bootlog .tap{font:inherit;font-weight:700;color:var(--acc);background:none;border:1.5px solid var(--acc);padding:6px 12px;cursor:pointer;white-space:nowrap}
#bootlog .tap.alt{color:var(--ink);border-color:var(--ink)}
#bootlog .tap:active{background:var(--acc);color:oklch(.16 0 0)}
.loadbar{height:4px;background:color-mix(in oklch,var(--ink) 25%,transparent);margin-top:8px}.loadbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}

/* ===== terminal (search + root) ===== */
#term{position:absolute;inset:0;z-index:50;background:#000;color:var(--tc);font-family:var(--mono);font-size:13px;line-height:1.45;display:flex;flex-direction:column;
  --tc:oklch(.93 .23 125);--tw:#fff;--tr:oklch(.66 .27 25);--tb:oklch(.82 .14 215);color-scheme:dark}
#term::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px);z-index:3}
#term::before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;mix-blend-mode:difference;
  background:linear-gradient(100deg,transparent 0%,#fff 30%,#fff 70%,transparent 100%) 100% 0/320% 100% no-repeat}
#term.flick::before{animation:tsweep 1.8s ease-in-out}
@keyframes tsweep{0%{opacity:0;background-position:100% 0}25%{opacity:1}75%{opacity:1}100%{opacity:0;background-position:0 0}}
#term .tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tc);color:#000;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 14px) 6px calc(var(--sal) + 14px)}
#term .tbar button{font-weight:700;letter-spacing:.14em;border:1.5px solid #000;padding:2px 8px}
#term .tbar button:active{background:#000;color:var(--tc)}
#tout{flex:1;overflow:auto;padding:12px calc(var(--sar) + 14px) 6px calc(var(--sal) + 14px);white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;scrollbar-width:none}
#tout::-webkit-scrollbar{display:none}
#tout .tl{min-height:1.45em}
#term .tw{color:var(--tw)}#term .tr{color:var(--tr)}#term .tb{color:var(--tb)}#term .tdim{opacity:.55}
#term .ti{background:var(--tc);color:#000;padding:0 5px;font-weight:700}
#term .tart{white-space:pre;line-height:1;min-height:0;color:var(--tw);overflow:hidden}
#term .tart.c{color:var(--tc)}
#term .granted{background:var(--tc);color:#000;font-weight:700;padding:0 6px}
#term .granted.no{background:var(--tr);color:#fff}
#term .sw{display:inline-block;width:2.2em;height:1em;vertical-align:-2px}
#term .lk{color:var(--tw);text-decoration:underline;text-decoration-color:color-mix(in oklch,var(--tc) 60%,transparent);cursor:pointer}
#thint{display:grid;gap:3px;padding:0 calc(var(--sar) + 14px) 4px calc(var(--sal) + 14px)}
#thint button{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 9px;border:1px solid color-mix(in oklch,var(--tc) 32%,transparent);color:var(--tc);font-size:13px;line-height:1.3;transition:background .1s,color .1s}
#thint button b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#thint button span{opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#thint button:first-child{background:var(--tc);color:#000;border-color:var(--tc)}
#thint button:active{background:var(--tw);color:#000}
#term .tprompt{display:flex;gap:10px;align-items:center;padding:8px calc(var(--sar) + 14px) calc(var(--sab) + 12px) calc(var(--sal) + 14px);border-top:1px solid color-mix(in oklch,var(--tc) 30%,transparent)}
#term .tprompt label{color:var(--tw);white-space:nowrap;font-weight:700}
#term.root .tprompt label{color:var(--tc)}
#tin{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tc);font:inherit;font-size:13px;caret-color:var(--tc);padding:6px 0}
#term canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* states */
html.asleep *,html.asleep *::before,html.asleep *::after{animation-play-state:paused!important}
html[data-nobreathe] .giant,html[data-nobreathe] .mhead h2,html[data-nobreathe] .brand,html[data-nobreathe] #boot .bt{animation:none!important}
html.inv .stage{filter:invert(1) hue-rotate(180deg)}
html[data-nodots] .stage{background-image:none}
html[data-nodots] #field,html[data-nodots] .giant-wrap{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="phone">

<div class="stage" id="stage">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="giant-wrap" aria-hidden="true"><div class="giant" id="giant">Jerelevance</div></div>

  <header class="top">
    <span class="brand">JRL<span class="slash">//</span>01</span>
    <span class="lbl" id="mname">home // field 01</span>
    <span class="stat"><span id="s-ntf" class="off">ntf<b>--</b></span><span>bat<b id="s-bat">--</b></span></span>
  </header>

  <section class="mpanel" data-panel="sys" aria-hidden="true">
    <div class="mhead c blk" data-blk="Header">
      <div class="ttl"><h2 id="t-sys">Sys</h2><span class="tag" data-dec>Live</span></div>
      <span class="lbl" id="sys-sub" data-dec="k">telemetry // clock load</span>
    </div>
    <div class="sysgrid">
      <div class="pn blk" data-blk="Load"><div class="ph"><span data-dec>Clock load</span><b>▾</b></div><div class="pb load" id="load"></div></div>
      <div class="pn blk" data-blk="Signal"><div class="ph"><span data-dec>Signal</span><b>▾</b></div><div class="pb"><canvas class="eq" id="eq" aria-hidden="true"></canvas></div></div>
      <div class="pn blk wide" data-blk="Recent"><div class="ph"><span data-dec>Recent // last launched</span><span id="rc-n">00</span></div><div class="rec" id="recent"></div></div>
      <div class="pn blk" data-blk="Notif"><div class="ph"><span data-dec>Notif</span><b>▾</b></div><div class="pb"><b class="big" id="sy-ntf">--</b><button type="button" class="chip" id="ntf-grant">Grant access</button><span class="lbl" id="ntf-on" hidden>listener bound</span></div></div>
      <div class="pn blk" data-blk="Device"><div class="ph"><span data-dec>Device</span><b>▾</b></div><div class="pb load" id="devinfo"></div></div>
      <div class="pn blk wide" data-blk="Feed"><div class="ph"><span data-dec>Event feed</span><span>tail -f</span></div><div class="pb" id="feed"></div></div>
      <div class="deco blk wide" data-blk="Glyphs"><div class="haz"></div><div class="picto" id="picto"></div><div class="bc" id="bc"></div></div>
    </div>
  </section>

  <section class="mpanel home on" data-panel="home">
    <div class="h-clock blk" data-blk="Clock">
      <div id="clock"><span id="c-h">00</span><span class="col">:</span><span id="c-m">00</span></div>
      <div class="h-side">
        <span id="c-date">---</span>
        <span class="lbl"><span id="c-s">00</span> · <span id="c-wk">WK --</span> · <span id="c-tz">ET</span></span>
        <div class="hours" id="hours" aria-hidden="true"></div>
      </div>
    </div>
    <div class="agenda pn blk" data-blk="Agenda">
      <button type="button" class="ph" id="ag-head"><span data-dec>Agenda // next 7 days</span><span id="ag-n">--</span></button>
      <div class="ag-list" id="agenda"></div>
    </div>
    <div class="np pn blk" data-blk="Now playing" id="np" hidden>
      <button type="button" class="np-eq" id="np-open" aria-label="Open the player"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></button>
      <button type="button" class="np-t" id="np-open2"><b id="np-title">—</b><span id="np-sub">—</span></button>
      <span class="np-c"><button type="button" data-mc="prev" aria-label="Previous"></button><button type="button" data-mc="toggle" id="np-play" aria-label="Play or pause"></button><button type="button" data-mc="next" aria-label="Next"></button></span>
    </div>
    <div class="hgrid blk" data-blk="Home" id="hgrid"></div>
  </section>

  <section class="mpanel" data-panel="apps" aria-hidden="true">
    <div class="mhead r blk" data-blk="Header">
      <div class="ttl"><h2 id="t-apps">Apps</h2><span class="tag" id="apps-tag">000</span></div>
      <span class="lbl" id="apps-sub" data-dec="k">a→z // hold for options</span>
    </div>
    <label class="findbar blk" data-blk="Find" for="find"><span class="u">find:</span><input id="find" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off" enterkeyhint="go" placeholder="type an app name" aria-label="Find an app"><button type="button" id="find-x" aria-label="Clear" hidden>×</button></label>
    <div class="gridwrap blk" data-blk="Packages">
      <div class="grid" id="grid"></div>
      <nav class="az" id="az" aria-label="Jump to letter"></nav>
    </div>
  </section>
  <div id="azbig" hidden></div>

  <footer class="floor">
    <button type="button" id="prompt" aria-label="Search and command line"><span class="u">visitor@jrl:~$</span><span class="cur"></span><span class="hint" id="p-hint">search · type ~ for root</span></button>
    <nav class="pager" id="pager" role="tablist" aria-label="Modules"></nav>
  </footer>
</div>

<div id="sheet" hidden>
  <div class="back"></div>
  <div class="sh" role="dialog" aria-label="App options">
    <div class="sh-h"><span class="ico" id="sh-ico"></span><span id="sh-t"></span><span id="sh-p"></span><span id="sh-n"></span><span id="sh-ntf" hidden></span></div>
    <div class="sh-acts" id="sh-acts"></div>
  </div>
</div>

<div id="folder" hidden>
  <div class="back"></div>
  <div class="sh fo" role="dialog" aria-label="Folder">
    <div class="fo-h"><input id="fo-name" maxlength="18" aria-label="Folder name" autocomplete="off" spellcheck="false"><span class="lbl" id="fo-n">00</span></div>
    <div class="fo-grid" id="fo-grid"></div>
    <div class="fo-f"><button type="button" id="fo-ungroup">Ungroup</button><button type="button" id="fo-close">Close</button></div>
  </div>
</div>

<div id="boot" hidden>
  <div class="btop"><span class="lbl">Node JRL-01 // home</span><span class="lbl">Cold start</span></div>
  <div class="left">
    <div class="bt">JERE<span class="slash">//</span><br>LEVANCE</div>
    <div id="bootlog"></div>
  </div>
  <div class="bottom"><div class="lbl" style="display:flex;justify-content:space-between"><span>Loading</span><span id="bootpct">0%</span></div><div class="loadbar"><i id="bootbar"></i></div></div>
</div>

</div>

<script>
(function () {
'use strict';
var $ = function (s) { return document.querySelector(s); }, $$ = function (s) { return [].slice.call(document.querySelectorAll(s)); };
var R = document.documentElement, stage = $('#stage'), phone = $('#phone');
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var pad = function (n) { return String(n).padStart(2, '0'); }, pad3 = function (n) { return String(n).padStart(3, '0'); };
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var store = { get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

    if (!THEMES[a]) return terr('theme: ' + ks.join(' | ') + ' | next | list');
    SET.theme = a; saveSet(); applyPal(); syncBars(); ttxt('theme // ' + a + ' // ' + THEMES[a].n, 'tb'); log('theme // ' + a);
  },
  color: function (a) { var m = { lime: 'oklch(.93 .23 125)', red: 'oklch(.66 .27 25)', cyan: 'oklch(.85 .15 200)', white: '#fff', amber: 'oklch(.83 .17 75)' }; if (!m[a]) return terr('color: lime | red | cyan | white | amber'); SET.tc = m[a]; saveSet(); term.el.style.setProperty('--tc', m[a]); ttxt('ink set to ' + a); },
  chaos: function (a) { var on = a !== 'off'; chaos(on); ttxt(on ? 'chaos on. the gui will start misbehaving.' : 'chaos contained.', on ? 'tr' : 'tb'); },
  invert: function (a) { R.classList.toggle('inv', a !== 'off'); ttxt('gui ' + (a !== 'off' ? 'inverted' : 'restored'), 'tb'); },
  hack: async function (a) {
    var tg = a || 'mainframe';
    ttxt('nmap -sS -p- ' + tg, 'tw'); await sleep(300);
    var ports = [[22, 'ssh'], [80, 'http'], [443, 'https'], [1420, 'hydrogen-line'], [4112, 'babel']];
    for (var i = 0; i < ports.length; i++) { ttxt(String(ports[i][0]).padEnd(6, ' ') + 'open   ' + ports[i][1], 'tdim'); await sleep(110); }
    ttxt('injecting payload into ' + tg + ' ...', 'tr'); for (var j = 0; j < 6; j++) { ttxt(hexrow(), 'tdim', { frames: 3, speed: 20 }); await sleep(55); }
    var b = tline(''); await pbar(b, 1200, 'exfiltrating'); flick();
    tline('<span class="tw">[ ok ]</span> <span class="granted">' + esc(tg) + ' owned</span>'); await sleep(400);
    ttxt('(just kidding. nothing left the phone.)', 'tdim'); log('tty // hacked ' + tg, true);
  },
  rm: async function (a) {
    if (!/-rf/.test(a || '')) return TC.uninstall(a);
    if (!isRoot) return terr('rm: permission denied (visitor). try ~');
    ttxt('rm -rf / --no-preserve-root', 'tr');
    var vic = APPS.slice(0, 12);
    for (var i = 0; i < vic.length; i++) { ttxt('removed /data/app/' + vic[i].pkg, 'tr', { frames: 3, speed: 18 }); await sleep(80); }
    ['removed /system/field', 'removed /system/fonts/doto', 'removed /home/jere'].forEach(function (x) { ttxt(x, 'tr', { frames: 3, speed: 18 }); });
    await sleep(300); flick(); await art(SKULL, 'c'); await sleep(300);
    tline('<span class="tr">[FAIL]</span> <span class="granted no">kernel panic</span>'); await sleep(700);
    ttxt('...restored from the library of babel. nothing was deleted. it never is.', 'tb', { frames: 16, speed: 26 });
  }
};
TC.o = TC.run = TC.open; TC.apps = TC.ll = TC.dir = TC.ls; TC.cls = TC.clear; TC.quit = TC.exit; TC.man = TC['?'] = TC.help; TC.g = TC.search = TC.web; TC.cd = TC.go; TC.wifi = function () { TC.settings('wifi'); }; TC.bt = function () { TC.settings('bt'); }; TC.launcher = function () { TC.settings('launcher'); };
function tfree() {
  term.busy = false; term.skip = false; if (termOpen() && !NB) term.inp.focus();
  var n = term.q.shift(); if (n) { tline('<span class="tw">' + esc(promptStr()) + '</span> ' + esc(n)); term.hist.push(n); term.hi = term.hist.length; trun(n); }
}
function trun(v) {
  if (!v) return; var parts = v.split(/\s+/), k = parts[0].toLowerCase(), arg = parts.slice(1).join(' '), r;
  if (/^(11[\/\-. ]?0?1[\/\-. ]?(19)?98|1998[\/\-. ]?11[\/\-. ]?0?1)$/.test(v.replace(/\s+/g, ''))) { bday().then(tfree, tfree); return; }
  if (v === '~' || k === 'su' || k === 'root') { rootLogin().then(tfree, tfree); return; }
  if (/^\d+$/.test(k)) { var a = APPS[parseInt(k, 10) - 1]; return a ? execApp(a) : terr('jsh: no package #' + k); }
  if (TC[k]) {
    if (ROOTCMD.indexOf(k) > -1 && !isRoot) return terr(k + ': permission denied (visitor). try ~');
    try { r = TC[k](arg); } catch (err) { console.error(err); return terr('jsh: ' + k + ': crashed. try again.'); }
    if (r && r.then) { term.busy = true; r.then(tfree, tfree); }
    return;
  }
  var m = matchApps(v, 1)[0]; if (m) return execApp(m);
  terr('jsh: ' + k + ': command not found. no package matches either.');
  tline('<span class="tdim">try </span><span class="lk" data-run="web ' + esc(v) + '">web ' + esc(v) + '</span>');
}

/* ---------- native events (Kotlin calls JRLnative.event) ---------- */
function onBack() {
  if (sheetOpen()) return closeSheet();
  if (folderOpen()) return closeFolder();
  if (termOpen()) return closeTerm();
  if (current === 'apps' && find.value) return clearFind();
  if (!bdone && bready) return finish();
  if (current !== 'home') return go('home', { from: { x: srect().left + srect().width / 2, y: srect().bottom - 40 } });
  bump(0);
}
function onHome() {
  closeSheet(); closeFolder(); clearFind(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); if (termOpen()) closeTerm(true); if (!booted) return;
  if (current !== 'home') go('home', { from: { x: srect().left + srect().width / 2, y: srect().top + srect().height / 2 } });
  else if (FLD.x) FLD.waves.push({ x: FLD.w / 2, y: FLD.h / 2, r: 0, s: 1 });
}
function onShow() { asleep = false; R.classList.remove('asleep'); DEV = API.device() || DEV; DEVT = performance.now(); poll(); tick(); pollAgenda(); pollMedia(); if (current === 'home') fieldStart(); if (current === 'sys') { refreshSys(); eqKick(); } syncBars(); }
function onHide() { asleep = true; R.classList.add('asleep'); fieldStop(); closeSheet(); press = null; if (window._reload) location.reload(); }
window.JRLnative = {
  event: function (name, data) {
    if (name === 'back') onBack(); else if (name === 'home') onHome(); else if (name === 'show') onShow(); else if (name === 'hide') onHide();
    else if (name === 'apps') { loadApps(); log('pm // package list changed'); }
    else if (name === 'error') log(String(data || 'error'), true);
    else if (name === 'calendar') pollAgenda();
    else if (name === 'updated') {
      var r = String(data || '');
      if (window._upd) { window._upd = false; ttxt(r === 'updated' ? 'new ui pulled. reloading …' : r === 'same' ? 'already on the latest ui.' : 'could not reach github. try again on wifi.', r === 'failed' ? 'tr' : 'tb'); if (window._updDone) window._updDone(); if (r === 'updated') setTimeout(function () { location.reload(); }, 900); }
      else if (r === 'updated') { window._reload = true; log('ui // update ready, applies next time you leave home', true); }
    }
  }
};
document.addEventListener('visibilitychange', function () { if (NB) return; if (document.hidden) onHide(); else onShow(); });
document.addEventListener('keydown', function (e) {
  if (!booted || termOpen() || /input/i.test(document.activeElement.tagName)) return;
  if (e.key === 'Escape') { e.preventDefault(); onBack(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var j = MODS.indexOf(current) + (e.key === 'ArrowRight' ? 1 : -1); if (MODS[j]) go(MODS[j], { from: { x: e.key === 'ArrowRight' ? srect().right : srect().left, y: srect().top + srect().height / 2 } }); else bump(e.key === 'ArrowRight' ? 1 : -1); }
  else if (e.key === '/' || e.key === '`' || e.key === '~' || (e.key.length === 1 && /[a-z0-9]/i.test(e.key) && !e.ctrlKey && !e.metaKey)) { e.preventDefault(); openTerm(); if (e.key.length === 1 && /[a-z0-9~]/i.test(e.key)) { term.inp.value = e.key; showHint(); } }
});

/* ---------- start ---------- */
DEV = API.device() || {}; DEVT = performance.now();
if (SET.breathe === false) R.dataset.nobreathe = '1';
if (SET.dots === false) R.dataset.nodots = '1';
loadApps(); poll(); tick(); renderPager(); applyPal(); refreshSys(); pollAgenda(); pollMedia();
$('#mname').textContent = modName();
var bootNow = SET.boot === 'always' || (SET.boot !== 'off' && ((DEV.uptime && DEV.uptime < 600) || store.get('jrl-uiv', '') !== UIV));
store.set('jrl-uiv', UIV);
if (bootNow) runBoot(); else { bdone = true; boot.hidden = true; enterHome(); }
window.JRL = { go: go, openTerm: openTerm, trun: function (v) { openTerm(v); }, sheet: function (i) { openSheet(APPS[i || 0]); }, apps: function () { return APPS; } };
})();
